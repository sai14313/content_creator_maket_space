# Render Blueprint for the CreatorAI backend.
#
# Deploy: In Render → New → Blueprint → pick your GitHub repo. Render reads this
# file automatically. It creates a Web Service with a Persistent Disk so the
# SQLite database and uploaded files survive restarts and redeploys.
#
# IMPORTANT: A Persistent Disk requires a PAID instance (plan: starter, ~$7/mo).
# For a $0 option, see the "Free alternative" note in DEPLOYMENT.md (Neon Postgres).
services:
  - type: web
    name: creatorai-api
    runtime: python
    rootDir: creatorai/backend
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: CREATORAI_ENV
        value: production
      # SQLite + uploads live on the mounted disk so data persists.
      - key: CREATORAI_DB
        value: /data/creatorai.db
      - key: CREATORAI_UPLOADS
        value: /data/uploads
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Auto-generated strong JWT secret (safe to commit — it is generated server-side).
      - key: CREATORAI_SECRET
        generateValue: true
      # YOU MUST SET THIS in the dashboard after the frontend is deployed on Vercel.
      # Comma-separated list of allowed origins, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: creatorai-data
      mountPath: /data
      sizeGB: 1
