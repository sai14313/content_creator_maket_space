# Render Blueprint for the CreatorAI app.
#
# SINGLE-SERVICE DEPLOY (recommended): the build compiles the React frontend and
# copies it into creatorai/backend/static, which FastAPI serves at the same
# origin as the API. Result: ONE deploy, ONE URL, and NO CORS / VITE_API_URL
# setup. Deploy via Render → New → Blueprint → pick your GitHub repo.
#
# The Persistent Disk keeps the SQLite database and uploads across restarts.
# It requires a PAID instance (plan: starter, ~$7/mo). For a $0 option see the
# "Free alternative" note in DEPLOYMENT.md (Neon Postgres).
services:
  - type: web
    name: creatorai-api
    runtime: python
    plan: starter
    # Keep the service rooted at the repository so both commands use explicit paths.
    buildCommand: "bash creatorai/backend/build.sh"
    startCommand: "cd creatorai/backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: CREATORAI_ENV
        value: production
      # SQLite + uploads live on the mounted disk so data persists.
      - key: CREATORAI_DB
        value: /data/creatorai.db
      - key: CREATORAI_UPLOADS
        value: /data/uploads
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Node version for building the frontend during deploy.
      - key: NODE_VERSION
        value: "20"
      # Auto-generated strong JWT secret (safe to commit — generated server-side).
      - key: CREATORAI_SECRET
        generateValue: true
      # SPLIT-DEPLOY ONLY: Required when the frontend is hosted on a different
      # domain than the backend. Add your frontend's origin(s) here (no trailing
      # slash). Example for Netlify:
      #
      #   https://your-app.netlify.app
      #   https://your-app.vercel.app
      #
      # If you are using the SINGLE-SERVICE setup (frontend served by the same
      # backend), leave this empty — no CORS is required.
      - key: CORS_ORIGINS
        sync: false
        value: "https://embed-6aca86fde9e15d34f6fff859--ai-content-market-place.netlify.app"
    disk:
      name: creatorai-data
      mountPath: /data
      sizeGB: 1
