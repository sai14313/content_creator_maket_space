# Render Blueprint for the CreatorAI backend.
#
# SINGLE-SERVICE DEPLOY (recommended): the build compiles the React frontend and
# copies it into creatorai/backend/static, which FastAPI serves at the same
# origin as the API. Result: ONE deploy, ONE URL, and NO CORS / VITE_API_URL
# setup. Deploy via Render → New → Blueprint → pick your GitHub repo.
#
# The Persistent Disk keeps the SQLite database and uploads across restarts.
# It requires a PAID instance (plan: starter, ~$7/mo). For a $0 option see the
# "Free alternative" note in DEPLOYMENT.md (Neon Postgres).
services:
  - type: web
    name: creatorai-api
    runtime: python
    rootDir: creatorai/backend
    plan: starter
    # Build the frontend and copy it into backend/static (see build.sh).
    # Runs from Root Directory creatorai/backend, so it can call ./build.sh.
    buildCommand: "bash build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: CREATORAI_ENV
        value: production
      # SQLite + uploads live on the mounted disk so data persists.
      - key: CREATORAI_DB
        value: /data/creatorai.db
      - key: CREATORAI_UPLOADS
        value: /data/uploads
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Node version for building the frontend during deploy.
      - key: NODE_VERSION
        value: "20"
      # Auto-generated strong JWT secret (safe to commit — generated server-side).
      - key: CREATORAI_SECRET
        generateValue: true
      # Optional: only needed for a SPLIT deploy (frontend hosted elsewhere).
      # For the single-service setup above this can stay empty — the frontend is
      # served same-origin, so no CORS is required.
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: creatorai-data
      mountPath: /data
      sizeGB: 1

